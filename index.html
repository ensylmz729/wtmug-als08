<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>P2P Transfer — Web</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="icon" href="icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-role="desktop">
  <header class="app-header">
    <h1>🔗 P2P Transfer — Web Arayüzü</h1>
    <span id="status" class="badge badge-wait">Bağlantı bekleniyor…</span>
  </header>

  <!-- QR Ekranı -->
  <section id="qrSection" class="qr-section">
    <p class="hint">Telefonunuzdan <strong>Mobil Arayüzü</strong> açın ve aşağıdaki QR kodu okutun.</p>
    <div id="qrcode" class="qr-box"></div>
    <p class="tiny">Oturum kimliği: <code id="peerIdLabel">—</code></p>
    <p class="tiny">Bu QR kod yalnızca bu oturum için geçerlidir ve sunucuya gönderilmez.</p>
  </section>

  <!-- Sohbet Ekranı -->
  <section id="chatSection" class="chat-section hidden">
    <div id="chatLog" class="chat-log"></div>

    <div id="progressArea" class="progress-area hidden">
      <div class="progress-row">
        <span id="progressLabel">Dosya aktarılıyor…</span>
        <span id="progressPct">0%</span>
      </div>
      <progress id="progressBar" value="0" max="100"></progress>
    </div>

    <form id="msgForm" class="input-row">
      <input type="text" id="msgInput" placeholder="Mesaj yazın…" autocomplete="off" />
      <button type="submit">Gönder</button>
    </form>

    <div class="file-row">
      <label class="file-btn">
        📎 Dosya Seç
        <input type="file" id="fileInput" hidden />
      </label>
      <span class="tiny">Her tür dosya (foto, video, pdf, zip…) desteklenir.</span>
    </div>
  </section>

  <!-- QR Kütüphanesi (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
